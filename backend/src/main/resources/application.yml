server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/club_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root          # 改成你本机 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.club.entity

# 自定义配置
club:
  jwt:
    # 生产环境请放入环境变量, 不要提交真实密钥
    secret: club-demo-secret-key-2026
    expire-minutes: 120     # 会话默认 2 小时
  sms:
    enabled: false          # true 时走 SmsClient 桩, 验证码打印在日志里
